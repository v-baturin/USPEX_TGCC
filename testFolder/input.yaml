main:
    generator:
        type: Evolution
        target:
            type: Atomistic
            conditions:
                externalPressure: 100
            compositionSpace:
                symbols: (Mg Al O)
                blocks:
                  - (4 8 16)
        popSize: 10
        optType: (aging '.enthalpy.4')
        fractions:
            heredity: (0.1 1.0 0.5)
            softmodemutation: (0.1 1.0 0.2)
            randSym: (0.05 1.0 0.1)
            randTop: (0.05 1.0 0.1)
            permutation: (0.05 1.0 0.1)
    optimizer:
        type: GlobalOptimizer
        optType: '.enthalpy.4'
    stages: (glp glp glp glp glp)
    numParallelCalcs: 2
    numGenerations: 3
    stopCrit: 3
    output:
        columns:
            - 'simpleMoleculeUtility.composition.origin'
            - '.enthalpy.4'
            - 'cellUtility.volume.4'
            - 'cellUtility.symmetry.4'
            - 'radialDistributionUtility.structureOrder.4'
            - 'radialDistributionUtility.averageOrder.4'
            - 'radialDistributionUtility.quasientropy.4'
        toDraw:
            - (dep '.enthalpy.4' per_atom ID raw)
            - (dep '.enthalpy.4' raw ID raw)
            - (dep '.enthalpy.4' per_atom 'cellUtility.volume.4' per_atom)
            - (stat '.enthalpy.4' per_atom)

glp:
    type : gulp
    commandExecutable : 'gulp'
    goptions : './Specific/goptions'
