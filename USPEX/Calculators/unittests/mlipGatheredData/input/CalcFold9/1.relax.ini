mlip                             true                 # <string>    MLIP type: "MTP" or "MTPR" or "void"
    mlip:load_from               1.mtp         # <string>    Filename with MTP. If not specified driver operates directly with Ab-Initio model (without additional routines)
calculate_efs                    TRUE                # <bool>      Enables/disables EFS calculation by MTP (disabled learning may be usefull in pure learning/selection regime for best performance)
sample                           true                # <bool>      Activates/deactivates selection (active learning engine)
    sample:threshold             4             # <double>    Selection threshold - maximum allowed extrapolation level (should be >=1)
    sample:threshold_break       21            # <double>    Break the program if this threshold exceeded. Activated if >1.0. If activated updates of selected set are restricted
    sample:save_sampled_to       sampled.cfg          # <string>    Selected configurations will be saved in this file after selection is complete. No configuration saving if not specified
    sample:add_grade_feature     true
#    sample:log                   selection.log   # <string>    Where to write selection log. No logging if not specified; if "stdout" and "stderr" corresponds to standard output streams; otherwise log will be outputed to file with that name

driver                                                          TRUE                       # Defines the configuration driver. Makes no sense if external driver is attached
                relax:pressure                      30                       # <double>      External pressure (in GPa). If not zero enthalpy is minimized
                relax:iteration_limit               5000                     # <int>         Maximal number of iteration of the relax process
                relax:mindist                       1.5                     # <double>      Minimal interatomic distance constraint (in Angstroms)
                relax:force_tolerance               0.00005                  # <double>      Forces on atoms in relaxed configuration should be smaller than this value (in eV/Angstroms). Zero or negative value disables atoms relax (changing fractional coordinates of atoms)
                relax:stress_tolerance              0.0005                   # <double>      Stresses in relaxed configuration should be smaller than this value (in GPa). Zero or negative value disables supercell relax (changing lattice vectors of the supercell)               
                relax:max_step                      0.05                     # <double>      Maximal allowed displacement of atoms and lattice vectors in Cartesian coordinates (in Angstroms)
                relax:min_step                      1.0e-7                  # <double>      Minimal displacement of atoms and lattice vectors in Cartesian coordinates (in Angstroms). If allactual displacemnts are lesser than relax stops
                relax:bfgs_wolfe_c1                 1.0e-1                  # <double>      Wolfe condition constant on the function decrease (linesearch stopping criterea)
                relax:bfgs_wolfe_c2                 0.8                     # <double>      Wolfe condition constant on the gradient decrease (linesearch stopping criterea)
                relax:log                           1.relax.log          # <string>      Where to write relax log. No logging if not specified; if "stdout" and "stderr" corresponds to standard output streams; otherwise log will be outputed to file with that name
		relax:freeze_small_grads            FALSE					 # <bool>        Don't move atoms if force is less then force-tolerance  
		relax:use_gd_method                 FALSE                   # <bool>        Use Gradient Descent method instead of BFGS if TRUE
		relax:correct_cell                  TRUE                   # <bool>        Make the lattice more orthogonal (if possible) and lower triangle
		relax:init_mindist                  {11:1.3552,17:0.8712}                     # <double>      Push atoms away from each other (with the pair potential) before relax to make minimal interatomic distance larger than this value
#		relax:forces_elasticity_scale       10                      # <double>      Initial value for Hessian		
#		relax:stress_elasticity_scale       50                      # <double>      Initial value for Hessian

