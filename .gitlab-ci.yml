stages:
  - test_phase1
  - build_phase1
  - test_phase2
  - build_phase2
  - test_phase3
  - build_phase3

test_sources:
  image: $CI_REGISTRY/uspex_python/thirdparty:master
  stage: test_phase1
  script:
    - cd ./USPEX
    - nosetests -v .

build_extensions:
  image: $CI_REGISTRY/uspex_python/thirdparty/cython38:master
  stage: build_phase1
  script:
    - mkdir unittests
    - find ./USPEX -type d -name "*unittests*" | xargs -I {} -t sh -c 'mkdir -p ./unittests/$(dirname {}) && mv {} ./unittests/$(dirname {})'
    - python buildExtensions.py build_uspex -b ./BuildExt
  artifacts:
    paths:
      - BuildExt
      - unittests
    expire_in: 1 mos 1 day

test_binaries:
  image: $CI_REGISTRY/uspex_python/thirdparty:master
  stage: test_phase2
  script:
    - cp -r ./unittests/* ./BuildExt/
    - cd ./BuildExt/USPEX
    - nosetests -v .

build_whl38:
  image: $CI_REGISTRY/uspex_python/thirdparty/cython38:master
  stage: build_phase2
  script:
    - mkdir build
    - cp pyproject.toml build/
    - cp -r ./BuildExt/* build/
    - cd build
    - flit build --format wheel
    - cd dist
    - rename  's/py3\-none\-any/cp38\-cp38\-linux_x86_64/' *.whl
  artifacts:
    paths:
      - build/dist

test_package:
  image: $CI_REGISTRY/uspex_python/thirdparty:master
  stage: test_phase3
  script:
    - pip install build/dist/uspex-*-cp38-cp38-linux_x86_64.whl
    - cd testFolder
    - uspex -r
  artifacts:
    paths:
      - testFolder

build_documentation:
  image: $CI_REGISTRY/uspex_python/thirdparty:master
  stage: build_phase3
  script:
    - pip install build/dist/uspex-*-cp38-cp38-linux_x86_64.whl
    - sphinx-build -b html sphinx build_docs
  artifacts:
    paths:
      - build_docs
    expire_in: 1 mos 1 day

build_whl39:
  image: $CI_REGISTRY/uspex_python/thirdparty/cython39:master
  stage: build_phase3
  script:
    - find ./USPEX -type d -name "*unittests*" | xargs rm -r
    - python buildExtensions.py build_uspex -b ./BuildExt39
    - cp -r ./BuildExt39/* build/
    - cp pyproject.toml build/
    - cd build
    - flit build --format wheel
    - cd dist
    - rename  's/py3\-none\-any/cp39\-cp39\-linux_x86_64/' *.whl
  artifacts:
    paths:
      - build/dist

build_whl310:
  image: $CI_REGISTRY/uspex_python/thirdparty/cython310:master
  stage: build_phase3
  script:
    - find ./USPEX -type d -name "*unittests*" | xargs rm -r
    - python buildExtensions.py build_uspex -b ./BuildExt310
    - cp -r ./BuildExt310/* build/
    - cp pyproject.toml build/
    - cd build
    - flit build --format wheel
    - cd dist
    - rename  's/py3\-none\-any/cp310\-cp310\-linux_x86_64/' *.whl
  artifacts:
    paths:
      - build/dist

