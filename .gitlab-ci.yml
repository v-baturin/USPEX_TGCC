stages:
  - unittesting_source
  - build
  - unittesting_binaries
  - deploy

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  IMAGE_TESTING_TAG: $CI_REGISTRY_IMAGE/testing:$CI_COMMIT_REF_SLUG
  IMAGE_RELEASE_TAG: $CI_REGISTRY_IMAGE:latest

unittesting_source:
  image: $CI_REGISTRY/uspex_python/thirdparty:latest
  stage: unittesting_source
  script:
    - nosetests ./USPEX

build:
  image: docker:stable
  services:
    - docker:dind
  stage: build
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker build -f Dockerfile.module -t uspex_common .
    - docker tag uspex_common $IMAGE_TAG
    - mkdir onlytests
    - find ./USPEX -type d -name "*unittests*" | xargs -I {} -t sh -c 'mkdir -p ./onlytests/$(dirname {}) && cp -r {} ./onlytests/$(dirname {})'
    - docker build -f Dockerfile.unittests -t $IMAGE_TESTING_TAG .
    - docker push $IMAGE_TAG
    - docker push $IMAGE_TESTING_TAG

unittesting_binaries:
  image: $IMAGE_TESTING_TAG
  stage: unittesting_binaries
  script:
    - nosetests /opt/USPEX

deploy:
  image: docker:stable
  services:
    - docker:dind
  stage: deploy
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $IMAGE_TAG
    - docker tag $IMAGE_TAG $IMAGE_RELEASE_TAG
    - docker push $IMAGE_RELEASE_TAG
