stages:
  - unittesting_source
  - build
  - unittesting_binaries
  - deploy

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2

unittesting_source:
  image: $CI_REGISTRY/uspex_python/uspex_again:master
  stage: unittesting_source
  script:
    - nosetests -v .

build:
  image: $CI_REGISTRY/uspex_python/thirdparty/cython:master
  stage: build
  script:
    - mkdir onlytests
    - find . -type d -name "*unittests*" | xargs -I {} -t sh -c 'mkdir -p ./onlytests/$(dirname {}) && mv {} ./onlytests/$(dirname {})'
    - python setup.py build_uspex -b ./Src
    - touch Src/USPEX/__init__.py
  artifacts:
    paths:
      - Src
      - onlytests
    expire_in: 1 mos 1 day

unittesting_binaries:
  image: $CI_REGISTRY/uspex_python/uspex_again:master
  stage: unittesting_binaries
  script:
    - cp -r ./onlytests/* ./Src/USPEX/Common
    - cd ./Src/USPEX/Common
    - nosetests -v .

trigger_build:
  image: $CI_REGISTRY/uspex_python/thirdparty/aux:master
  stage: deploy
  script:
    - "curl -X POST -F token=$USPEX_AGAIN_BUILD_TRIGGER -F ref=master -F variables[SUBPROJECT_ID]=$CI_PROJECT_ID -F variables[SUBPROJECT_REF]=$CI_COMMIT_REF_SLUG https://git.uspex-team.org/api/v4/projects/59/trigger/pipeline"
  except:
    - triggers
