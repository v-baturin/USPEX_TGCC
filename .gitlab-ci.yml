build_whl36:
  image: $CI_REGISTRY/uspex_python/thirdparty/cython:master
  stage: build_phase2
  script:
    - mkdir build
    - cp pyproject.toml build/
    - cp -r ./BuildExt/* build/
    - cd build
    - flit build --format wheel
    - cd dist
    - rename  'py3\-none\-any' 'cp36\-cp36m\-linux_x86_64' *.whl
  artifacts:
    paths:
      - build/dist

test_package:
  image: $CI_REGISTRY/uspex_python/thirdparty:master
  stage: test_phase3
  script:
    - pip install dist/USPEX-*-cp36-cp36m-linux_x86_64.whl
    - cd testFolder
    - python -m USPEX.main
  artifacts:
    paths:
      - testFolder

build_image:
  image: docker:stable
  services:
    - docker:dind
  stage: build_phase3
  script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker build -t $IMAGE_TAG .
    - docker push $IMAGE_TAG
  only:
    - master

